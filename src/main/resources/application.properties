spring.application.name=biblioteca_api

server.port=8081
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=true


# ===============================
# SEGURIDAD & JWT
# ===============================
# Clave secreta (cadena de 256 bits en hexadecimal)
jwt.secret-key=${JWT_SECRET_KEY}
# Expiración: 24 horas en milisegundos (24 * 60 * 60 * 1000)
jwt.expiration=86400000

# ===============================
# SWAGGER / OPENAPI UI CONFIG
# ===============================
# Ordenar los grupos por nombre alfabético (1. Auth, 2. Libros, etc.)
springdoc.swagger-ui.tags-sorter=alpha
# Ordenar los endpoints dentro de cada grupo por método HTTP o ruta
springdoc.swagger-ui.operations-sorter=method
# Habilitar filtro de búsqueda rápida de endpoints en la UI
springdoc.swagger-ui.filter=true
# Mantener las secciones colapsadas al inicio para vista limpia
springdoc.swagger-ui.doc-expansion=none